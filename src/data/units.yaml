    - скф 276 сд 44 А
  short_name: 276 сд                      # краткое для подписей/таблиц
  parent_unit: ''                         # id вышестоящего соединения (напр. unit-044-00 — 44-я армия); '' если нет
  front: СКФ                              # фронт (Северо-Кавказский и т.п.)
  army: 44 А                              # армия в составе
  commander: ''                           # командир(ы), ФИО строкой; позже можно link на authors.id
  formation_date: ''                      # дата формирования (без кавычек!)
  disbandment_date: ''                    # дата расформирования / последнего упоминания
  battles: []                             # массив сражений/операций: [«Оборона Крыма», «Штурм Сиваша»]
  obd_source_doc: src/content/posts/276-ya-strelkovaya-diviziya.md  # адрес записи в ЭТОМ репо (в fallen-cards — зеркало с тем же именем)
  schema_type: Organization               # техническая схема Schema.org
  url: ''                                 # карточка соединения на сайте проекта (когда появится)
  sameAs: []                              # внешние справочники (Википедия, Память Народа)
  image: ''
  license_note: ''
  access: публичный                       # публичный | ограниченный | внутренний
  note: 'ключ словаря: 276-00-fallen-cards; образец-заготовка, поля уточняются'
  
