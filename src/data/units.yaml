# ============================================================
# РЕЕСТР ВОЙСКОВЫХ СОЕДИНЕНИЙ (Single Source of Truth) — ЗАГОТОВКА
# src/data/units.yaml — единый источник данных о частях, дивизиях,
# бригадах, полках и отрядах, в которых служили павшие.
#
# СТАТУС: коллекция units зарегистрирована в content.config.ts (аддон).
#
# ИСТОЧНИКИ ДАННЫХ:
#   - ВНЕШНИЙ РАБОЧИЙ РЕПОЗИТОРИЙ: https://github.com/annachurasheva/fallen-cards
#     Подготовка карточек павших и файлов войсковых соединений ведётся там;
#     соединения оттуда же пополняются и уточняются. Зеркало словаря — в docs/Libraries/.
#   - warunits-fallen-cards.json / .md — словарь 85 соединений (всего по базе):
#     ключ (077-00-fallen-cards), развёрнутое имя, варианты написаний.
#     В units.yaml переносятся по согласованию едиными коммитами владельца проекта.
#
# ПРАВИЛА (общие для всех реестров, см. docs/REGISTRIES-GUIDE.md):
#   1. id — СТРОГО УНИКАЛЕН внутри файла и между ВСЕМИ реестрами
#      (authors / units / cemeteries). Формат: строчные латиница+цифры+дефис.
#      Рекомендация: сохранять числовой код карточки как префикс id
#      (077-00 -> unit-077-00) — это бесплатная сверка с источником.
#   2. ДАТЫ — строго без кавычек, формат YYYY-MM-DD (plain style).
#      При неизвестном дне/месяце — год ('1941') или partial ('1941-06');
#      канонический формат OBD «__.__.1941» переносим как есть только
#      в note, в поля дат его не пишем.
#   3. ПУСТЫЕ ЗНАЧЕНИЯ: строки — '', массивы — []. null запрещён.
#   4. Разделяйте записи комментарием: # --- соединение: Название ---
#   5. ВНЕШНИЕ ССЫЛКИ НА СЕРВИСЫ МО РФ (obd-memorial.ru, memmo.ru и др.):
#      официальное предупреждение Минобороны: «Для корректной и безопасной
#      работы сайта Минобороны России и его сервисов используйте браузеры
#      с поддержкой российских сертификатов или установите корневой сертификат
#      Минцифры России». Практические следствия для реестра:
#        (а) ссылки в полях url / sameAs храним как есть, но в note ставим
#            метку [Минцифры] — читатель предупреждён о требовании сертификата;
#        (б) автоматическую проверку доступности таких URL при сборке НЕ делаем
#            (сервис недоступен без российского корневого сертификата);
#            проверка ссылок — только ручная выборка из браузера с сертификатом;
#        (в) карточка соединения должна быть САМОДОСТАТОЧНОЙ: ключевые данные
#            (имена, написания, подчиненность, сражения) дублируем в полях
#            записи, чтобы внешняя неработающая ссылка не обесценивала карточку.
# ============================================================

# --- Соединение: 276-я стрелковая дивизия (ЗАГОТОВКА-ОБРАЗЕЦ) ---
