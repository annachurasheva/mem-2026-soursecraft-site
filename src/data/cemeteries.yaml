# ============================================================
# РЕЕСТР МЕМОРИАЛЬНЫХ КЛАДБИЩ (Single Source of Truth) — ЗАГОТОВКА
# src/data/cemeteries.yaml — единый источник данных о локациях
# захоронений: воинские кладбища, братские могилы, некрополи,
# паспорта объектов культурного наследия, координаты, охранные статусы.
#
# СТАТУС: файл-заготовка. Коллекция `cemeteries` ещё НЕ зарегистрирована
# в src/content.config.ts — этот файл сейчас игнорируется сборкой.
# Активация = изолированный аддон (см. docs/REGISTRIES-GUIDE.md, раздел 5).
#
# ИСТОЧНИК ДАННЫХ:
#   - Рабочая локация проекта: ЛЕНИНСКИЙ РАЙОН, РЕСПУБЛИКА КРЫМ.
#     Актуальная выгрузка OBD Memorial по району:
#     docs/Libraries/memorial_objects_leninskyi_r.csv — 14 учётных объектов:
#     ВМС-номер, адрес, тип/состояние захоронения, количество погибших, шеф.
#     Прочие файлы memorial_objects*.csv (550+ объектов по всей базе) — справочные,
#     подключаются только по решению владельца проекта.
#
# ПРАВИЛА (общие для всех реестров, см. docs/REGISTRIES-GUIDE.md):
#   1. id — СТРОГО УНИКАЛЕН внутри файла и между ВСЕМИ реестрами.
#      Рекомендация: id строится из географии + номера ВМС:
#      simferopolskiy-trudovoe, sevastopol-35-bb-nisha-18.
#      Для однотипных ниш одного мемориала — суффикс nisha-NN.
#   2. ДАТЫ — строго без кавычек, формат YYYY-MM-DD.
#      Даты OBD вида «03.07.2015» переводим в ISO: 2015-07-03.
#      Даты вида «__.__.1944» (день неизвестен) — пишем '1944' строкой
#      в примечании или 1944-01-01 с пояснением в note — НЕ выдумываем точность.
#   3. ПУСТЫЕ ЗНАЧЕНИЯ: строки — '', массивы — [], числа — пропускаем поле.
#      null и «висячие» двоеточия запрещены.
#   4. Разделяйте записи комментарием: # --- кладбище: Название ---
#   5. ВНЕШНИЕ ССЫЛКИ НА СЕРВИСЫ МО РФ (obd-memorial.ru, memmo.ru и др.):
#      официальное предупреждение Минобороны: «Для корректной и безопасной
#      работы сайта Минобороны России и его сервисов используйте браузеры
#      с поддержкой российских сертификатов или установите корневой сертификат
#      Минцифры России». Практические следствия для реестра:
#        (а) ссылки в полях url / sameAs храним как есть, но в note ставим
#            метку [Минцифры] — читатель предупреждён о требовании сертификата;
#        (б) автоматическую проверку доступности таких URL при сборке НЕ делаем
#            (сервис недоступен без российского корневого сертификата);
#            проверка ссылок — только ручная выборка из браузера с сертификатом;
#        (в) карточка объекта должна быть САМОДОСТАТОЧНОЙ: все данные CSV
#            (адрес, состояние, количество, шеф, ВМС-номер) уже продублированы
#            в полях записи — внешняя неработающая ссылка не обесценивает карточку.
# ============================================================

