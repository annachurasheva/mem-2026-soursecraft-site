on:
  push:
    - workflows: build-retypeset
      filter:
        branches: ["master"]
        paths:
          - "package.json"
          - "pnpm-lock.yaml"
          - "patches/**"
          - "scripts/**"
          - "src/**"
          - "public/**"
          - "astro.config.ts"

workflows:
  build-retypeset:
    tasks:
      - name: build-task
        cubes:
          # Установка зависимостей (патч автора применяется автоматически через
          # pnpm.patchedDependencies), затем сборка статики.
          # Цепочка install -> patch -> build держится в одном кубике,
          # чтобы изменения в node_modules не потерялись.
          - name: install-and-build
            image: node:24.5.0
            script:
              - corepack enable
              - corepack prepare pnpm@10.33.0 --activate
              - pnpm --version
              - pnpm install --frozen-lockfile
              - pnpm build
            artifacts:
              paths:
                - dist